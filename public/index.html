<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiChatDemo — visitor site</title>
<style>
  :root {
    --ink: #1c1d21; --paper: #fafaf7; --muted: #6b6e76;
    --accent: #0e7c66; --line: #e3e2dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Georgia, "Times New Roman", serif;
    background: var(--paper); color: var(--ink); line-height: 1.55;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 120px; }
  .announce {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    color: var(--accent); border: 1px solid var(--line); border-radius: 999px;
    display: inline-block; padding: 4px 14px; margin-bottom: 24px; background: #fff;
  }
  h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: -0.5px; }
  .tagline { font-size: 20px; color: var(--muted); font-style: italic; margin: 0 0 40px; }
  h2 {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 8px; margin: 40px 0 16px;
  }
  .service { padding: 14px 0; border-bottom: 1px dashed var(--line); }
  .service b { font-size: 17px; }
  .service p { margin: 4px 0 0; color: var(--muted); }
  .contact a { color: var(--accent); }

  /* chat widget */
  #chat-fab {
    position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px;
    border-radius: 50%; border: none; background: var(--accent); color: #fff;
    font-size: 22px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  #chat-panel {
    position: fixed; right: 24px; bottom: 92px; width: min(360px, calc(100vw - 48px));
    height: 460px; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    display: none; flex-direction: column; overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,.18);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #chat-panel.open { display: flex; }
  #chat-head { padding: 12px 16px; background: var(--ink); color: #fff; font-size: 14px; }
  #chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.model { align-self: flex-start; background: #f0efe9; border-bottom-left-radius: 4px; }
  .msg.err { align-self: center; color: #b3261e; font-size: 12px; }
  #chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #chat-input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  #chat-form button { padding: 9px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #chat-form button:disabled { opacity: .5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="announce" id="announcement"></div>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>

    <h2>Services</h2>
    <div id="services"></div>

    <h2>Contact</h2>
    <p class="contact">Write to <a id="contact" href="#"></a></p>
  </div>

  <button id="chat-fab" title="Chat with us">✳</button>
  <div id="chat-panel">
    <div id="chat-head">Ask us anything</div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Type a question…" autocomplete="off">
      <button type="submit" id="chat-send">Send</button>
    </form>
  </div>

<script>
  // ---- render site data (so admin edits are visible on refresh) ----
  async function loadSite() {
    const site = await (await fetch("/api/site")).json();
    document.title = site.title + " — AiChatDemo";
    document.getElementById("title").textContent = site.title;
    document.getElementById("tagline").textContent = site.tagline;
    document.getElementById("announcement").textContent = site.announcement;
    const c = document.getElementById("contact");
    c.textContent = site.contactEmail;
    c.href = "mailto:" + site.contactEmail;
    document.getElementById("services").innerHTML = "";
    for (const s of site.services) {
      const div = document.createElement("div");
      div.className = "service";
      const b = document.createElement("b"); b.textContent = s.name;
      const p = document.createElement("p"); p.textContent = s.description;
      div.append(b, p);
      document.getElementById("services").append(div);
    }
  }
  loadSite();

  // ---- chat widget ----
  const history = []; // {role: "user"|"model", text}
  const log = document.getElementById("chat-log");
  const input = document.getElementById("chat-input");
  const send = document.getElementById("chat-send");

  document.getElementById("chat-fab").onclick = () => {
    document.getElementById("chat-panel").classList.toggle("open");
    input.focus();
  };

  function bubble(cls, text) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.append(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  document.getElementById("chat-form").onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;
    history.push({ role: "user", text });
    bubble("user", text);
    const pending = bubble("model", "…");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      pending.textContent = data.reply;
      history.push({ role: "model", text: data.reply });
    } catch (err) {
      pending.remove();
      history.pop(); // keep history consistent with what the model saw
      bubble("err", err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  };
</script>
</body>
</html>
